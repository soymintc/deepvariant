on: [push]

jobs:
  setup_deepsomatic:
    runs-on: ubuntu-latest
    name: DeepSomatic Docker Setup
    steps:
      # Step 1: Check out the repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: Set up Docker Buildx for advanced builds
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # Step 3: Lint the Dockerfile to catch errors early
      - name: Lint Dockerfile
        run: |
          docker run --rm -i hadolint/hadolint hadolint --ignore DL3006 --ignore DL3015 --ignore DL3008 --ignore DL3042 - < Dockerfile

      # Step 4: Log in to DockerHub to prevent rate limiting
      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Step 5: Build the Docker image
      - name: Build Docker Image
        run: |
          docker buildx build \
            --load \
            -t soymintc/deepvariant:v1 .

      # Step 6: Verify Image Exists
      - name: Verify Image Exists
        run: docker images | grep "soymintc/deepvariant"

      # Step 7: Push the Docker image to DockerHub
      - name: Push Docker Image
        run: |
          docker push soymintc/deepvariant:v1

      # Step 8: Test if `run_deepsomatic --help` produces output
      - name: Test `run_deepsomatic --help`
        run: |
          docker run --rm soymintc/deepvariant:v1 run_deepsomatic --help > help.out || true
          if grep -q "run_deepsomatic" help.out; then
            echo "Help output detected."
          else
            echo "Help output not detected!" >&2
            exit 1
          fi

